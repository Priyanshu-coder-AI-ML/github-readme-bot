name: Update profile README

on:
  schedule:
    - cron: "0 3 * * *"        # every day at 03:00 UTC
  workflow_dispatch:            # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths: ["config.yaml", "templates/**", "readme_bot/**"]

permissions:
  contents: write               # needed so the job can commit README.md

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate README
        run: python -m readme_bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "readme-bot"
          git config user.email "readme-bot@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update profile README"
            git push
          fi
